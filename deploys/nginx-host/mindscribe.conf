# MindScribe 宿主机 nginx：免备案期使用 8443 非标端口作为主入口。
# 背景：域名未备案时，80/443 标准端口会被腾讯云审查按概率注入 302 备案拦截页；
# 非标端口不在 HTTP 明文审查范围，可正常对外服务。备案通过后可改回标准端口。
server {
    # 主入口：非标端口 HTTPS。
    listen 8443 ssl;
    server_name mind-scribe.online www.mind-scribe.online;

    ssl_certificate /etc/letsencrypt/live/mind-scribe.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mind-scribe.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 容器内 nginx 对无斜杠 API 路径会 301 补斜杠且 Location 是 http，
        # 在此改写为 https，避免混合内容拦截。
        proxy_redirect http://$host/ https://$host/;
    }
}

# 80 端口：直接跳转到 8443 主入口（备案拦截只影响响应内容，跳转本身可达即生效；
# 若跳转也被注入，用户需手动带 https:// 和端口访问）。
server {
    listen 80;
    server_name mind-scribe.online www.mind-scribe.online;
    return 301 https://$host:8443$request_uri;
}
