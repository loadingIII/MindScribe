<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MindScribe 智能体 Demo</title>
<style>
  /* 简易测试页：跟随 MindScribe 的浅色拟态风格 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Manrope", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    background: #eeeff4; color: #4a4a68;
    display: flex; justify-content: center; padding: 24px;
  }
  .app {
    width: 100%; max-width: 720px; height: calc(100vh - 48px);
    display: flex; flex-direction: column; gap: 16px;
  }
  header {
    background: #eeeff4; border-radius: 18px; padding: 14px 20px;
    box-shadow: -6px -6px 14px rgba(255,255,255,.8), 6px 6px 14px rgba(163,177,198,.4);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  .modes { display: flex; gap: 8px; }
  .modes button {
    border: none; cursor: pointer; padding: 8px 14px; border-radius: 12px;
    background: #eeeff4; color: #4a4a68; font-size: 13px; font-weight: 600;
    box-shadow: -3px -3px 8px rgba(255,255,255,.8), 3px 3px 8px rgba(163,177,198,.4);
    transition: all .2s;
  }
  .modes button.active {
    color: #35406b;
    box-shadow: inset -3px -3px 8px rgba(255,255,255,.8), inset 3px 3px 8px rgba(163,177,198,.5);
  }
  #log {
    flex: 1; overflow-y: auto; padding: 18px; border-radius: 18px;
    background: #eeeff4;
    box-shadow: inset -5px -5px 12px rgba(255,255,255,.75), inset 5px 5px 12px rgba(163,177,198,.35);
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user {
    align-self: flex-end; background: #d7ddf3; border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start; background: #f4f5f9; border-bottom-left-radius: 4px;
  }
  .msg .route-chip {
    display: inline-block; font-size: 11px; padding: 1px 8px; margin-bottom: 6px;
    border-radius: 999px; background: #e3e8f8; color: #6b77a8;
  }
  .proposal-card {
    align-self: flex-start; max-width: 88%; background: #f4f5f9;
    border-radius: 14px; padding: 12px 14px; border-left: 4px solid #a8b8e8;
  }
  .proposal-card h3 { font-size: 13px; margin-bottom: 6px; color: #5b68a0; }
  .proposal-card .params { font-size: 12px; color: #8a8fae; margin-bottom: 4px; }
  .proposal-card .prompt-text {
    font-size: 12px; color: #6a6f8e; background: #e9ebf4; padding: 8px;
    border-radius: 8px; margin: 6px 0; max-height: 90px; overflow-y: auto;
  }
  .proposal-card button {
    border: none; cursor: pointer; padding: 8px 16px; border-radius: 10px;
    background: #a8b8e8; color: #fff; font-weight: 700; font-size: 13px;
  }
  .proposal-card button:disabled { opacity: .5; cursor: default; }
  form { display: flex; gap: 10px; }
  #input {
    flex: 1; border: none; outline: none; padding: 14px 18px;
    border-radius: 16px; background: #eeeff4; color: #4a4a68; font-size: 14px;
    box-shadow: inset -4px -4px 10px rgba(255,255,255,.75), inset 4px 4px 10px rgba(163,177,198,.4);
  }
  #send {
    border: none; cursor: pointer; padding: 0 22px; border-radius: 16px;
    background: #a8b8e8; color: #fff; font-weight: 700; font-size: 14px;
  }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌾 小麦 · 智能助手 Demo</h1>
    <div class="modes">
      <button data-mode="auto" class="active">自动路由</button>
      <button data-mode="chat">客服</button>
      <button data-mode="gen_imgs">生图</button>
    </div>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="试试：「查我的积分」 或 「画一张赛博朋克风格的猫」" autocomplete="off" />
    <button id="send" type="submit">发送</button>
  </form>
</div>

<script>
// 会话状态：历史消息与当前模式，页面刷新即重置（demo 不持久化）
const history = [];
let mode = "auto";

const logEl = document.getElementById("log");
const formEl = document.getElementById("form");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");

// 模式切换按钮
document.querySelectorAll(".modes button").forEach((btn) => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    document.querySelectorAll(".modes button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

function addMsg(cls, text, routeChip) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (routeChip) {
    const chip = document.createElement("span");
    chip.className = "route-chip";
    chip.textContent = routeChip === "chat" ? "客服助手" : routeChip === "gen_imgs" ? "绘画助手" : "自动路由";
    div.appendChild(chip);
    div.appendChild(document.createElement("br"));
  }
  div.appendChild(document.createTextNode(text));
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

// 渲染生图提案确认卡片
function addProposalCard(proposal) {
  const card = document.createElement("div");
  card.className = "proposal-card";
  const title = document.createElement("h3");
  title.textContent = "🖼️ 生图提案";
  const summary = document.createElement("div");
  summary.className = "params";
  summary.textContent = proposal.summary || "（无描述）";
  const meta = document.createElement("div");
  meta.className = "params";
  meta.textContent = `尺寸 ${proposal.size} · ${proposal.n} 张 · 模型 ${proposal.model}`;
  const promptText = document.createElement("div");
  promptText.className = "prompt-text";
  promptText.textContent = proposal.prompt;
  const btn = document.createElement("button");
  btn.textContent = "立即生成（Demo 未接入）";
  btn.addEventListener("click", () => {
    btn.disabled = true;
    btn.textContent = "Demo 演示：确认后应调用 POST /gen_imgs/threads";
  });
  card.append(title, summary, meta, promptText, btn);
  logEl.appendChild(card);
  logEl.scrollTop = logEl.scrollHeight;
}

formEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || sendEl.disabled) return;

  inputEl.value = "";
  sendEl.disabled = true;
  addMsg("user", text);
  history.push({ role: "user", content: text });

  // 立即显示"思考中"占位，避免用户感觉页面没反应
  const botMsg = addMsg("bot", "思考中…", mode === "auto" ? "auto" : null);
  let acc = "";

  try {
    const resp = await fetch("/agent/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: history,
        user_id: "user123",
        user_name: "演示用户",
        mode: mode,
      }),
    });

    // 非 200 响应直接把状态展示出来，不再静默
    if (!resp.ok) {
      botMsg.textContent = "服务返回错误：" + resp.status + " " + resp.statusText;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let firstToken = true;

    // 手动解析 SSE：按空行分隔事件帧
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop();

      for (const frame of frames) {
        const eventLine = frame.split("\n").find((l) => l.startsWith("event: "));
        const dataLine = frame.split("\n").find((l) => l.startsWith("data: "));
        if (!eventLine || !dataLine) continue;
        const event = eventLine.slice(7).trim();
        const data = JSON.parse(dataLine.slice(6));

        if (event === "token" && data.delta) {
          // 收到第一个 token 时清掉"思考中"占位
          if (firstToken) {
            botMsg.textContent = "";
            firstToken = false;
          }
          acc += data.delta;
          botMsg.textContent = acc;
          logEl.scrollTop = logEl.scrollHeight;
        } else if (event === "action") {
          if (data.action === "generate_images") addProposalCard(data.proposal);
        } else if (event === "error") {
          botMsg.textContent = (acc ? acc + "\n" : "") + "[出错了] " + data.message;
        }
      }
    }

    // 整个流结束仍没有任何回复时给出提示
    if (!acc) {
      botMsg.textContent = "（本次没有生成回复内容，请重试或查看服务日志）";
    } else {
      history.push({ role: "assistant", content: acc });
    }
  } catch (err) {
    botMsg.textContent = "请求失败：" + err.message
      + "\n请确认服务已启动：uvicorn exp.agent_service_demo.app:app --port 8100";
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
});
</script>
</body>
</html>
