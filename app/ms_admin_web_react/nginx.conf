# MindScribe 管理端 Nginx 配置：托管静态资源，并将 API 路径反代到 backend 服务。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 前缀反代到 backend。
    # 与主前端同理：location 不能带尾部斜杠，避免不带斜杠的请求
    # 触发 nginx 补斜杠 301 重定向（重定向丢失 https 会被浏览器拦截）。

    location /auth {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 单页应用路由回退：未命中的路径返回 index.html。
    # absolute_redirect off 让补斜杠重定向使用相对路径，不再降级成 http。
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
