spring:
  config:
    # 加载本地 .env（仅用于开发环境，生产环境建议使用系统环境变量）
    import: optional:file:.env[.properties]
  application:
    name: ms-backend-java
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/mindscribe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 加载 XML 中的动态更新语句（updateThread/updateAttempt）。
mybatis:
  mapper-locations: classpath:/com.ms/mapper/*.xml

# 本地 FastAPI 图片生成服务
image-generation:
  base-url: ${IMAGE_GENERATION_BASE_URL:http://127.0.0.1}
  port: ${IMAGE_GENERATION_PORT:8000}

http-client:
  connect-timeout: 5s            #通用 HTTP 连接超时时间
  read-timeout: 60s              #通用 HTTP 等待响应超时时间

oss:
  endpoint: ${OSS_ENDPOINT}
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: ${OSS_BUCKET_NAME}
  url-expire-seconds: ${OSS_URL_EXPIRE_SECONDS:3600}

jwt:
  # 开发环境默认值；生产环境必须通过 JWT_SECRET 设置独立的高强度密钥。
  secret: ${JWT_SECRET:mindscribe-development-jwt-secret-change-before-production}
  issuer: ${JWT_ISSUER:mindscribe}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:14400}
  cookie-name: ${JWT_COOKIE_NAME:mindscribe-token}
  secure-cookie: ${JWT_SECURE_COOKIE:false}

spring.data.redis:
  host: ${REDIS_HOST:127.0.0.1}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:0}
