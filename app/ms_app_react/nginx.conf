# MindScribe 前端 Nginx 配置：托管静态资源，并将后端 API 路径反代到 backend 服务。
server {
    listen 80;
    server_name _;

    # 与后端 multipart 限制保持一致（最大 20MB 请求）。
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # API 前缀反代到 backend。
    # 注意：location 不能带尾部斜杠（如 /prompt_templates/），
    # 否则不带斜杠的请求（如 /prompt_templates?page=0）会落入 SPA 回退，
    # 触发 nginx 补斜杠的 301 重定向；该重定向是绝对地址且丢失 https 协议，
    # 在 https 站点下会被浏览器按混合内容拦截，导致接口数据拿不到。
    # 去掉斜杠后前缀匹配可同时命中带与不带斜杠的路径，彻底避免重定向。

    location /gen_imgs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prompt_templates {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /credits {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 单页应用路由回退：未命中的路径返回 index.html。
    # absolute_redirect off 让 nginx 的补斜杠重定向使用相对路径，
    # 浏览器会基于当前 https 源解析，不会降级成 http。
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
